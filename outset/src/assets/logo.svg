<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Outset">
  <defs>
    <linearGradient id="bg" x1="20" y1="8" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFBF4"/>
      <stop offset="0.45" stop-color="#F2F0E7"/>
      <stop offset="1" stop-color="#D7E6DA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 40) rotate(90) scale(48)">
      <stop stop-color="#FFE6A8"/>
      <stop offset="1" stop-color="#FFE6A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafG" x1="78" y1="34" x2="102" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BB48A"/>
      <stop offset="1" stop-color="#3F6B4F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <circle cx="70" cy="40" r="42" fill="url(#glow)"/>
  <!-- stoop / sill -->
  <path d="M34 104h60" stroke="#3F6B4F" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
  <!-- doorway arch -->
  <path d="M42 104V62c0-12.15 9.85-22 22-22s22 9.85 22 22v42" stroke="#3F6B4F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- inner light slit -->
  <path d="M64 48v48" stroke="#6FA87E" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <!-- threshold bar -->
  <path d="M46 104h36" stroke="#3F6B4F" stroke-width="5" stroke-linecap="round"/>
  <!-- crafted leaf (no emoji) -->
  <g filter="url(#soft)">
    <path d="M86 38c10-8 20 2 14 14-8-1-16-7-14-14z" fill="url(#leafG)"/>
    <path d="M86 38c5 5 10 10 14 14" stroke="#2F513C" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
  </g>
  <!-- soft mote -->
  <circle cx="52" cy="56" r="1.6" fill="#3F6B4F" opacity="0.35"/>
  <circle cx="74" cy="70" r="1.2" fill="#3F6B4F" opacity="0.28"/>
</svg>
