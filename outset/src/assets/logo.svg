<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Outset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="55%" stop-color="#E8F0E6"/>
      <stop offset="100%" stop-color="#D5E5D8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6FA87E"/>
      <stop offset="100%" stop-color="#3F6B4F"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FFE9B8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE9B8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#sky)"/>
  <circle cx="64" cy="42" r="36" fill="url(#sun)"/>
  <!-- arch / doorway -->
  <path d="M40 100 V58 A24 24 0 0 1 88 58 V100" fill="none" stroke="#3F6B4F" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M40 100 H88" stroke="#3F6B4F" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <!-- leaf -->
  <path d="M78 46 C90 38 98 48 92 60 C84 58 76 52 78 46Z" fill="url(#leaf)"/>
  <path d="M78 46 C84 52 88 56 92 60" fill="none" stroke="#2F513C" stroke-width="1.4" opacity="0.5"/>
</svg>
