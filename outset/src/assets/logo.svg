<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Outset">
  <defs>
    <linearGradient id="lg-bg" x1="12" y1="4" x2="118" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8EE"/>
      <stop offset="0.38" stop-color="#F3EDE0"/>
      <stop offset="1" stop-color="#C9DCCB"/>
    </linearGradient>
    <radialGradient id="lg-sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(78 36) rotate(90) scale(52)">
      <stop stop-color="#FFE4A3"/>
      <stop offset="0.55" stop-color="#F6D48A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F6D48A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg-door" x1="64" y1="38" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE9B8"/>
      <stop offset="1" stop-color="#6FA87E"/>
    </linearGradient>
    <linearGradient id="lg-leaf" x1="82" y1="30" x2="112" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3D0AD"/>
      <stop offset="1" stop-color="#2F513C"/>
    </linearGradient>
    <filter id="lg-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="32" fill="url(#lg-bg)"/>
  <circle cx="78" cy="36" r="46" fill="url(#lg-sun)"/>
  <!-- stoop shadow -->
  <ellipse cx="64" cy="108" rx="34" ry="6" fill="#3F6B4F" opacity="0.12"/>
  <!-- inner light -->
  <path d="M46 104V64c0-10.5 8.3-19 18.5-19S83 53.5 83 64v40" fill="url(#lg-door)" opacity="0.55"/>
  <!-- arch -->
  <path d="M42 106V63c0-12.7 10.3-23 23-23s23 10.3 23 23v43" stroke="#2F513C" stroke-width="5.2" stroke-linecap="round"/>
  <!-- light slit -->
  <path d="M64.5 46v50" stroke="#FFF6D8" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <path d="M64.5 46v50" stroke="#6FA87E" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  <!-- sill -->
  <path d="M40 106h48" stroke="#2F513C" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M36 111h56" stroke="#3F6B4F" stroke-width="2.2" stroke-linecap="round" opacity="0.28"/>
  <!-- leaf -->
  <g>
    <path d="M86 34c12-10 24 3 16 17-9-1.5-18-8-16-17z" fill="url(#lg-leaf)"/>
    <path d="M86 34c6 6 12 12 16 17" stroke="#1C2A22" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
    <path d="M98 28c8-4 14 6 8 12" stroke="#3F6B4F" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/>
  </g>
  <circle cx="50" cy="58" r="1.7" fill="#3F6B4F" opacity="0.35"/>
  <circle cx="76" cy="72" r="1.2" fill="#3F6B4F" opacity="0.28"/>
  <circle cx="54" cy="78" r="1" fill="#3F6B4F" opacity="0.2"/>
</svg>
