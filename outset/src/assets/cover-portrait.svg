<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" fill="none" role="img" aria-label="Outset cover">
  <defs>
    <linearGradient id="sky" x1="360" y1="0" x2="360" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE9C4"/>
      <stop offset="0.38" stop-color="#F7EFE0"/>
      <stop offset="0.72" stop-color="#E3EDDF"/>
      <stop offset="1" stop-color="#C5D8C6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(520 168) rotate(90) scale(260)">
      <stop stop-color="#FFF3C4"/>
      <stop offset="0.35" stop-color="#F5D07A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F5D07A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="420" x2="720" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FB89A"/>
      <stop offset="1" stop-color="#3F6B4F"/>
    </linearGradient>
    <linearGradient id="wall" x1="140" y1="260" x2="580" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFBF4"/>
      <stop offset="0.55" stop-color="#F2EBDC"/>
      <stop offset="1" stop-color="#D7E4D6"/>
    </linearGradient>
    <linearGradient id="inside" x1="360" y1="300" x2="360" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4CC"/>
      <stop offset="0.45" stop-color="#E8C56A"/>
      <stop offset="1" stop-color="#3F6B4F"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="80" y1="520" x2="210" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8D0B0"/>
      <stop offset="1" stop-color="#2F513C"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="560" y1="500" x2="680" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BB48A"/>
      <stop offset="1" stop-color="#234332"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="720" height="920" fill="url(#sky)"/>
  <circle cx="520" cy="168" r="210" fill="url(#sun)"/>
  <!-- distant canopy -->
  <path d="M-40 430C80 360 160 390 250 420C340 390 430 340 520 370C620 404 700 390 760 430V560H-40V430Z" fill="#9CBFA4" opacity="0.45"/>
  <path d="M-40 470C90 410 200 450 310 470C430 430 540 400 650 450C710 472 760 460 780 490V620H-40V470Z" fill="url(#hill)" opacity="0.55"/>

  <!-- house mass -->
  <path d="M96 860V340c0-28 22-50 50-50h428c28 0 50 22 50 50v520" fill="url(#wall)"/>
  <path d="M96 860V340c0-28 22-50 50-50h428c28 0 50 22 50 50v520" stroke="#3F6B4F" stroke-width="6" opacity="0.18"/>

  <!-- window -->
  <rect x="168" y="360" width="78" height="96" rx="8" fill="#E7F0E4" stroke="#3F6B4F" stroke-width="4"/>
  <path d="M207 360v96M168 408h78" stroke="#3F6B4F" stroke-width="3" opacity="0.45"/>
  <rect x="176" y="368" width="28" height="34" rx="3" fill="#FFF8E4" opacity="0.7"/>

  <!-- interior glow in doorway -->
  <path d="M248 820V430c0-64 52-116 116-116s116 52 116 116v390" fill="url(#inside)"/>
  <ellipse cx="364" cy="470" rx="70" ry="90" fill="#FFF6D2" opacity="0.55" filter="url(#glow)"/>

  <!-- light shaft -->
  <path d="M300 430 L364 250 L428 430 L500 820 L228 820 Z" fill="#FFF3C2" opacity="0.18"/>

  <!-- arch -->
  <path d="M236 824V428c0-70.7 57.3-128 128-128s128 57.3 128 128v396" stroke="#2F513C" stroke-width="14" stroke-linecap="round"/>
  <path d="M364 318v430" stroke="#FFF8DC" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- sill + steps -->
  <path d="M220 824h288" stroke="#2F513C" stroke-width="16" stroke-linecap="round"/>
  <path d="M196 852h336" stroke="#3F6B4F" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <path d="M172 876h384" stroke="#3F6B4F" stroke-width="7" stroke-linecap="round" opacity="0.28"/>

  <!-- left plant -->
  <ellipse cx="132" cy="790" rx="38" ry="14" fill="#2F513C" opacity="0.18"/>
  <path d="M132 790c-8-70-40-110-8-168" stroke="#3F6B4F" stroke-width="6" stroke-linecap="round"/>
  <path d="M90 650c40-36 70 8 48 52-28-2-52-26-48-52z" fill="url(#leaf1)"/>
  <path d="M128 620c36-20 54 18 28 46-22-4-40-24-28-46z" fill="#6FA87E"/>
  <path d="M150 680c30-28 58 6 34 40-22-2-40-22-34-40z" fill="#2F513C" opacity="0.85"/>
  <rect x="112" y="768" width="40" height="36" rx="6" fill="#C9B89A"/>

  <!-- right plant -->
  <ellipse cx="590" cy="800" rx="42" ry="14" fill="#2F513C" opacity="0.16"/>
  <rect x="568" y="772" width="46" height="40" rx="7" fill="#D7C4A3"/>
  <path d="M590 772c10-80 48-120 12-176" stroke="#2F513C" stroke-width="6" stroke-linecap="round"/>
  <path d="M548 620c44-30 78 14 50 56-32-4-58-30-50-56z" fill="url(#leaf2)"/>
  <path d="M600 590c38-24 62 16 34 50-26-2-46-28-34-50z" fill="#8FBE9B"/>
  <path d="M630 660c28-22 52 10 30 38-20-2-34-20-30-38z" fill="#3F6B4F"/>

  <!-- motes -->
  <circle cx="300" cy="360" r="4" fill="#3F6B4F" opacity="0.22"/>
  <circle cx="430" cy="300" r="3" fill="#3F6B4F" opacity="0.18"/>
  <circle cx="390" cy="520" r="2.5" fill="#FFF8DC" opacity="0.7"/>
  <circle cx="250" cy="560" r="3" fill="#3F6B4F" opacity="0.16"/>
  <circle cx="470" cy="580" r="2" fill="#FFF8DC" opacity="0.55"/>
</svg>
