<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Outset cover">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="40%" stop-color="#F3F0E8"/>
      <stop offset="100%" stop-color="#D9E8DC"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#FFE7B0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE7B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sage" cx="18%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#7BA88A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7BA88A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <circle cx="740" cy="240" r="280" fill="url(#glow)"/>
  <circle cx="180" cy="520" r="260" fill="url(#sage)"/>
  <!-- large arch -->
  <path d="M520 520 V290 A140 140 0 0 1 800 290 V520" fill="none" stroke="#3F6B4F" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <path d="M520 520 H800" stroke="#3F6B4F" stroke-width="7" opacity="0.4"/>
  <!-- leaf cluster -->
  <g transform="translate(780 210) rotate(18)">
    <ellipse cx="0" cy="0" rx="48" ry="18" fill="#6FA87E"/>
    <ellipse cx="36" cy="22" rx="40" ry="14" fill="#5B8F6C" opacity="0.85"/>
  </g>
  <text x="96" y="200" font-family="Georgia, serif" font-size="92" fill="#1C2A22" font-weight="600">Outset</text>
  <text x="100" y="270" font-family="system-ui, sans-serif" font-size="34" fill="#5A6B5E">Leave light. Arrive ready.</text>
  <text x="100" y="520" font-family="system-ui, sans-serif" font-size="22" fill="#7A8B7E" letter-spacing="4">THE LAST THIRTY SECONDS</text>
</svg>
